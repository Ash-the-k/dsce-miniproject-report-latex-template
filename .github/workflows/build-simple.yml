# build-simple.yml
#
# Alternative workflow — deploys the compiled PDF directly to GitHub Pages.
# Visiting your Pages URL will open the PDF immediately, no landing page.
#
# HOW TO USE:
#   Option A (recommended): Delete build.yml and rename this file to build.yml
#   Option B: Keep both files. Go to Actions tab → "Build and Deploy (Simple)"
#             → Run workflow to trigger manually.
#
# NOTE: Only one workflow should deploy to GitHub Pages at a time.
#       If you switch to this one, delete or disable build.yml first.

name: Build and Deploy (Simple)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_bibtex: true

      - name: Generate OG Image and Favicon from PDF
        run: |
          pdftoppm -r 150 -png -singlefile main.pdf og-image
          pdftoppm -r 32  -png -singlefile main.pdf favicon-raw
          convert favicon-raw.png -gravity North -extent 100%x100% favicon.png

      - name: Prepare GitHub Pages Files
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          # Extract project title from main.tex — grab the \ProjectTitle{...} block,
          # strip the command wrapper, collapse multi-line titles, clean up whitespace
          REPORT_TITLE=$(awk '/\\ProjectTitle\{/,/\}/' main.tex \
            | sed 's/.*\\ProjectTitle{//; s/}.*//' \
            | tr -d '\n\\' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' )

          # Fallback if extraction fails
          REPORT_TITLE=${REPORT_TITLE:-"VTU Mini-Project Report"}

          mkdir public
          cp main.pdf public/
          cp og-image.png public/
          cp favicon.png public/

          cat > public/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=main.pdf">
            <title>${REPORT_TITLE}</title>

            <link rel="icon" type="image/png" href="favicon.png">

            <meta name="description" content="${REPORT_TITLE} — VTU Mini-Project Report, DSCE.">

            <meta property="og:type" content="website">
            <meta property="og:url" content="${PAGES_URL}">
            <meta property="og:title" content="${REPORT_TITLE}">
            <meta property="og:description" content="${REPORT_TITLE} — VTU Mini-Project Report, DSCE.">
            <meta property="og:image" content="${PAGES_URL}og-image.png">

            <meta property="twitter:card" content="summary_large_image">
            <meta property="twitter:url" content="${PAGES_URL}">
            <meta property="twitter:title" content="${REPORT_TITLE}">
            <meta property="twitter:description" content="${REPORT_TITLE} — VTU Mini-Project Report, DSCE.">
            <meta property="twitter:image" content="${PAGES_URL}og-image.png">
          </head>
          <body>
            <p>Opening PDF... <a href="main.pdf">click here if it doesn't open</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4