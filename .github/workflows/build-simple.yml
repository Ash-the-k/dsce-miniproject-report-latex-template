# build-simple.yml
#
# Alternative workflow — deploys the compiled PDF directly to GitHub Pages.
# Visiting your Pages URL will open the PDF immediately, no landing page.
#
# HOW TO USE:
#   Option A (recommended): Delete build.yml and rename this file to build.yml
#   Option B: Keep both files. Go to Actions tab → "Build and Deploy (Simple)"
#             → Run workflow to trigger manually.
#
# NOTE: Only one workflow should deploy to GitHub Pages at a time.
#       If you switch to this one, delete or disable build.yml first.

name: Build and Deploy (Simple)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_bibtex: true

      - name: Prepare GitHub Pages Files
        run: |
          mkdir public
          cp main.pdf public/
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=main.pdf">
            <title>Redirecting to PDF...</title>
          </head>
          <body>
            <p>Opening PDF... <a href="main.pdf">click here if it doesn't open</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4